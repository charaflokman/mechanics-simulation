<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",Tahoma,Arial,sans-serif}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}

.read{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.read span{display:block;font-size:12px;color:var(--muted)}
.read b{display:block;direction:ltr;text-align:right;font-size:15px}
.notes{margin-top:12px}
.notes h3{margin:0 0 6px;font-size:15px}
.eq{direction:ltr;text-align:left;font-family:Cambria,"Times New Roman",serif;font-size:16px;margin:3px 0;overflow-wrap:anywhere}
.verdict{margin-top:8px;font-weight:600}

.barl{display:flex;justify-content:space-between;font-size:13px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:start}

:root{--bg:#f8f6f0;--panel:#fffdf8;--ink:#23201b;--muted:#6b645a;--line:#d8d2c4;--accent:#0f5c5c;--accent-soft:#e6efe9}

<body>
<div class="app">
<nav id="nav"><h1>تطور جملة ميكانيكية</h1><p>الوحدة 02 · 3 علوم تجريبية</p></nav>
<main id="main"></main>
</div>
<script>
const Phys={
  projectile({v0,alpha,h,g}){
    const r=alpha*Math.PI/180,c=Math.cos(r),s=Math.sin(r),vx=v0*c,vy0=v0*s;
    const tS=Math.max(vy0/g,0),xS=vx*tS,yS=h+vy0*tS-g*tS*tS/2;
    const tP=(vy0+Math.sqrt(vy0*vy0+2*g*h))/g,xP=vx*tP;
    return{vx,vy0,tS,xS,yS,tP,xP,vP:Math.hypot(vx,vy0-g*tP),A:g/(2*vx*vx),B:s/c,
      at:t=>{const y=h+vy0*t-g*t*t/2;return{x:vx*t,y:Math.abs(y)<1e-9?0:y,vx,vy:vy0-g*t}},
      yOf:x=>h+x*s/c-g*x*x/(2*vx*vx)};
  },
  solveE(M,e){let lo=M-e-1e-9,hi=M+e+1e-9;for(let i=0;i<60;i++){const E=(lo+hi)/2;if(E-e*Math.sin(E)<M)lo=E;else hi=E}return (lo+hi)/2}
};
const SUP={'-':'⁻',0:'⁰',1:'¹',2:'²',3:'³',4:'⁴',5:'⁵',6:'⁶',7:'⁷',8:'⁸',9:'⁹'};
function fmt(x,d=2){
  if(!isFinite(x))return '—';
  const m=Math.abs(x);
  if(m!==0&&(m>=1e5||m<1e-3)){
    const [a,b]=x.toExponential(Math.max(d,2)).split('e');
    return a.replace('.',',')+'×10'+String(+b).replace(/./g,ch=>SUP[ch]);
  }
  const o=x.toFixed(d);return (/^-0(\.0*)?$/.test(o)?o.slice(1):o).replace('.',',');
}
const cssCache=new Map();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>cssCache.clear());
function css(n){let v=cssCache.get(n);if(v===undefined){v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();cssCache.set(n,v)}return v}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function slider(parent,o){
  const w=el('div','ctl'),l=el('label'),box=el('span','val'),t=el('input'),i=el('input');
  t.type='text';t.inputMode='decimal';t.setAttribute('aria-label',o.label);box.append(t);
  if(o.unit)box.append(' '+o.unit);
  l.append(o.label,box);i.type='range';i.min=o.min;i.max=o.max;i.step=o.step;i.value=o.value;i.setAttribute('aria-label',o.label);
  const plain=(v,d)=>(+v).toFixed(d).replace('.',','),dec=o.dec??(String(o.step).split('.')[1]||'').length;
  const hint=el('small','hint');
  const show=v=>{t.value=plain(v,dec);hint.textContent=''};
  i.oninput=()=>{show(+i.value);o.on(+i.value)};
  t.onchange=()=>{
    const n=parseFloat(t.value.replace(/[,،٫]/,'.'));
    if(isNaN(n)){show(+i.value);hint.textContent='أدخل عددا';return}
    let v=Math.min(o.max,Math.max(o.min,n));if(o.step===1)v=Math.round(v);i.value=v;t.value=(+v.toFixed(6)).toString().replace('.',',');o.on(v);
    hint.textContent=o.step===1&&Math.round(n)===v?'':v!==n?`المجال المسموح: من ${plain(o.min,dec)} إلى ${plain(o.max,dec)}`:'';
  };
  show(o.value);w.append(l,i,hint);parent.append(w);
  return{set(v){i.value=v;show(v)},input:i};
}
const CM=37.8; // بكسل لكل 1 cm على الشاشة (تقريبي حسب الجهاز)
function plot(cv,{xl,yl,series,mark}){
  if(NOGRAPH)return;
  const {c,W,H}=fit(cv),ml=58,mr=14,mt=26,mb=34,all=series.flatMap(s=>s.pts);
  if(!all.length)return;
  const nice=(a,b)=>{const r=(b-a||1)/Math.max(2,Math.min(5,W/95)),p=10**Math.floor(Math.log10(r)),q=r/p;return (q<1.5?1:q<3.5?2:q<7.5?5:10)*p};
  let x0=Math.min(0,...all.map(q=>q[0])),x1=Math.max(...all.map(q=>q[0])),y0=Math.min(0,...all.map(q=>q[1])),y1=Math.max(0,...all.map(q=>q[1]));
  if(x1===x0)x1=x0+1;if(y1===y0)y1=y0+1;
  const X=x=>ml+(x-x0)/(x1-x0)*(W-ml-mr),Y=y=>H-mb-(y-y0)/(y1-y0)*(H-mb-mt),mut=css('--muted');
  c.font='11px Tahoma';c.lineWidth=1;
  const sx=nice(x0,x1),sy=nice(y0,y1),d=s=>s>=1e5||s<1e-3?1:s>=1?0:Math.min(6,Math.ceil(-Math.log10(s)));
  for(let v=Math.ceil(x0/sx)*sx;v<=x1+1e-12;v+=sx){c.strokeStyle=css('--line');c.beginPath();c.moveTo(X(v),mt);c.lineTo(X(v),H-mb);c.stroke();c.fillStyle=mut;c.fillText(fmt(v,d(sx)),X(v)-10,H-mb+15)}
  for(let v=Math.ceil(y0/sy)*sy;v<=y1+1e-12;v+=sy){c.strokeStyle=css('--line');c.beginPath();c.moveTo(ml,Y(v));c.lineTo(W-mr,Y(v));c.stroke();c.fillStyle=mut;c.fillText(fmt(v,d(sy)),6,Y(v)+4)}
  c.strokeStyle=css('--ink');c.lineWidth=1.3;c.beginPath();c.moveTo(ml,Y(0));c.lineTo(W-mr,Y(0));c.moveTo(X(0),mt);c.lineTo(X(0),H-mb);c.stroke();
  c.fillStyle=css('--ink');c.font='600 12px Tahoma';c.fillText(yl,8,16);c.fillText(xl,W-mr-60,H-6);
  let lx=ml+110;
  for(const s of series){
    c.strokeStyle=c.fillStyle=s.color;c.lineWidth=2.2;
    if(s.dots)for(const q of s.pts){c.beginPath();c.arc(X(q[0]),Y(q[1]),4,0,7);c.fill()}
    else{c.beginPath();s.pts.forEach((q,i)=>i?c.lineTo(X(q[0]),Y(q[1])):c.moveTo(X(q[0]),Y(q[1])));c.stroke()}
    if(series.length>1&&s.name){c.fillRect(lx,8,14,4);c.fillText(s.name,lx+18,15);lx+=70}
    if(mark&&s.mark){c.beginPath();c.arc(X(s.mark[0]),Y(s.mark[1]),5,0,7);c.fill()}
  }
}
function graphPanel(stage,options){
  const row=el('div','grow','<label>البيان: </label>'),sel=el('select'),cv=el('canvas','graph');
  options.forEach(o=>sel.append(new Option(o,o)));sel.setAttribute('aria-label','اختيار البيان');
  row.append(sel);stage.append(row,cv);return{sel,cv};
}
function reads(parent,list){
  const box=el('div','reads'),m={};
  for(const [k,t] of list){const r=el('div','read',`<span>${t}</span><b></b>`);box.append(r);m[k]=r.querySelector('b')}
  parent.append(box);return (k,v)=>m[k].textContent=v;
}
let CAP=null,NOGRAPH=false,lastTL=null;
function strobeBody(x,y){if(CAP)CAP.body=[x,y]}
function arrow(c,x,y,dx,dy,color,label){
  if(CAP)CAP.push({x,y,dx,dy,color,label});
  const n=Math.hypot(dx,dy);if(n<2)return;
  const ux=dx/n,uy=dy/n,X=x+dx,Y=y+dy;
  c.strokeStyle=c.fillStyle=color;c.lineWidth=2.2;
  c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke();
  c.beginPath();c.moveTo(X,Y);const hd=Math.min(9,n*.5),hw=hd/2;c.lineTo(X-hd*ux-hw*uy,Y-hd*uy+hw*ux);c.lineTo(X-hd*ux+hw*uy,Y-hd*uy-hw*ux);c.fill();
  if(label){c.font='italic 600 14px Cambria,serif';c.lineWidth=3;c.strokeStyle='rgba(0,0,0,.55)';c.strokeText(label,X+5*ux+4,Y+5*uy+4);c.fillText(label,X+5*ux+4,Y+5*uy+4)}
}
function fit(cv){
  const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1,w=Math.round(r.width*d),h=Math.round(r.height*d);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
  const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.direction='ltr';c.textAlign='left';c.clearRect(0,0,r.width,r.height);
  return{c,W:r.width,H:r.height};
}
function shell(root,title,sub){
  root.innerHTML='';root.append(el('h2',null,title),el('p','sub',null));root.querySelector('.sub').textContent=sub;
  const tools=el('div','tools'),layout=el('div','layout'),stage=el('div','card'),cv=el('canvas'),side=el('div','card');
  stage.append(cv);layout.append(stage,side);root.append(tools,layout);
  return{tools,cv,side,stage};
}
function btn(p,t,fn,cls){const b=el('button','btn '+(cls||''));b.type='button';b.textContent=t;b.onclick=fn;p.append(b);return b}

function timeline(parent,o){
  lastTL=o;
  const row=el('div','tline'),r=el('input'),out=el('b');
  r.type='range';r.min=0;r.max=1000;r.value=0;r.setAttribute('aria-label','الزمن');
  const go=t=>o.set(Math.min(o.max(),Math.max(0,t)));
  btn(row,'⏮',()=>go(0));
  btn(row,'◀',()=>go(o.get()-o.step()));
  row.append(r);
  btn(row,'▶',()=>go(o.get()+o.step()));
  btn(row,'⏭',()=>go(o.max()));
  row.append(out);parent.append(row);
  r.oninput=()=>go(+r.value/1000*o.max());
  const span=()=>o.max()||1;
  return{sync(){const t=o.get();r.value=t/span()*1000;out.textContent='t = '+(o.toS?fmt(t*o.toS,2)+' s':fmt(t,o.unit==='s'&&o.max()>1000?0:2)+' s')}};
}
function lesson(root,html){
  const d=el('details','card lesson',`<summary>الدرس والتمارين</summary>${html}`);d.open=true;root.append(d);
}
const LESSON_PROJECTILE=`
<h3>دراسة حركة قذيفة بسرعة ابتدائية غير شاقولية</h3>
<p>نهمل قوى احتكاك المائع ودافعة أرخميدس أمام قوة الثقل. الجملة المدروسة: الكرة. المعلم: سطحي أرضي مزود بمعلم مستو (O, x, y). القوة المؤثرة: قوة الثقل P.</p>
<h4>طبيعة الحركة</h4>
<p>بتطبيق القانون الثاني لنيوتن:</p>
<div class="eq">ΣF_ext = m a ⟹ P = m a ⟹ m g = m a ⟹ a = g</div>
<p>بالإسقاط: aₓ = 0 فالحركة على Ox مستقيمة منتظمة، و a_y = −g فالحركة على Oy مستقيمة متغيرة بانتظام.</p>
<h4>الشروط الابتدائية</h4>
<div class="eq">x₀ = 0 , y₀ = 0 , v₀ₓ = v₀ cosα , v₀ᵧ = v₀ sinα</div>
<h4>المعادلات الزمنية</h4>
<div class="eq">vₓ(t) = v₀ cosα</div><div class="eq">v_y(t) = −g t + v₀ sinα</div>
<div class="eq">x(t) = v₀ cosα · t</div><div class="eq">y(t) = −½ g t² + v₀ sinα · t</div>
<h4>معادلة المسار</h4>
<p>نقصي الزمن: من x(t) نجد t = x / (v₀ cosα)، وبالتعويض في y(t):</p>
<div class="eq">y = −g x² / (2 v₀² cos²α) + x tanα</div>
<p>وهي من الشكل y = a x² + b x، وتمثل معادلة قطع مكافئ.</p>
<h4>الذروة S</h4>
<p>أعلى نقطة يصلها مركز عطالة الكرة، وعندها v_y = 0:</p>
<div class="eq">t_S = v₀ sinα / g</div>
<div class="eq">x_S = v₀² cosα sinα / g , y_S = v₀² sin²α / (2g)</div>
<p>نعوض t_S في x(t) و y(t):</p>
<div class="eq">x_S = v₀ cosα · (v₀ sinα / g) , y_S = −½ g (v₀ sinα / g)² + v₀ sinα · (v₀ sinα / g)</div>
<p>وسرعة الكرة في الذروة: v_S = √(vₓ² + v_y²) = vₓ = v₀ cosα لأن v_y = 0.</p>
<h4>المدى P</h4>
<p>المسافة بين نقطة الانطلاق ونقطة السقوط على المستوي الأفقي، وعندها y = 0:</p>
<div class="eq">x ( −g x / (2 v₀² cos²α) + tanα ) = 0</div>
<p>للمعادلة حلان: x = 0 وهي نقطة الانطلاق، والحل الثاني هو المدى:</p>
<div class="eq">x_P = 2 v₀² sinα cosα / g</div>
<p>وبما أن 2 sinα cosα = sin2α:</p>
<div class="eq">x_P = v₀² sin2α / g</div>
<p>ملاحظات عند القذف من بداية المعلم: يكون المدى أعظميا عندما sin2α = 1 أي α = 45°، و x_P = 2 x_S، وكلما كبرت v₀ كبرت الذروة والمدى.</p>
<h4>انحفاظ الطاقة للجملة (قذيفة + أرض)</h4>
<div class="eq">E_c = ½ m v² , E_pp = m g h , E_T = E_c + E_pp = cte</div>
<div class="eq">t = 0 : E_T = ½ m v₀²</div>
<div class="eq">S : E_T = ½ m v₀² cos²α + m g y_S</div>
<div class="eq">P : E_T = ½ m v_P²</div>
<h4>القذف من الأعلى نحو الأسفل (α = 0)</h4>
<div class="eq">x(t) = v₀ t , y(t) = ½ g t² , y = g x² / (2 v₀²)</div>
<p>المحور Oy هنا موجه نحو الأسفل، والمسار جزء من قطع مكافئ.</p>
<h4>مثال الدرس</h4>
<p>v₀ = 5√2 m/s و α = 45° و g = 10 m/s²:</p>
<div class="eq">x = 5t , y = −5t² + 5t , y = −x²/5 + x</div>
<div class="eq">t_S = 0,5 s , y_S = 1,25 m , v_S = 5 m/s , x_P = 5 m , v_P = 5√2 m/s</div>
<h4>بكالوريا 2016 علوم تجريبية</h4>
<p>يستقبل لاعب الكرة برأسه فيقذفها من النقطة B نحو المرمى. 1) أوجد x(t) و y(t)، ومعادلة المسار، وسرعة الكرة في الذروة. 2) اكتب الشرط على x و y لتسجيل الهدف مباشرة، وهل سجل اللاعب الهدف؟ برر.</p>
<p>v₀ = 10 m/s و α = 30° و h_B = 2 m و d = 10 m و L = 2,44 m و g = 10 m/s²:</p>
<div class="eq">y = −0,067 x² + 0,58 x + 2 , v_S = 8,66 m/s</div>
<p>شرط الهدف: x = 10 m و 0 ≤ y &lt; 2,44 m. بالتعويض y = 1,1 m، فالهدف يسجل.</p>`;
const LESSON_KEPLER=`
<h3>قوانين كبلر الثلاثة</h3>
<p><b>القانون الأول (المدارات):</b> تتحرك الكواكب حول الشمس وفق مدارات إهليلجية (قطوع ناقصة)، تمثل الشمس إحدى محرقيها. يمثل a نصف طول المحور الكبير و b نصف طول المحور الصغير. الدائرة حالة خاصة ينطبق فيها المحرقان في مركز الدائرة.</p>
<p><b>القانون الثاني (المساحات):</b> المستقيم الرابط بين مركز الشمس ومركز الكوكب يمسح مساحات متساوية خلال مجالات زمنية متساوية: A₁ = A₂. فسرعة الكوكب متغيرة: أعظمية عند الحضيض P (الأقرب) وأصغرية عند الأوج A (الأبعد).</p>
<p><b>القانون الثالث (الأدوار):</b> مربع الدور المداري يتناسب طردا مع مكعب نصف طول المحور الكبير:</p>
<div class="eq">T² / a³ = K</div>
<p>وحدة T الثانية s، ووحدة a المتر m، ووحدة K هي s²·m⁻³. وفي المسار الدائري T² = K r³.</p>
<h3>الحركة الدائرية المنتظمة</h3>
<p>المسار دائري، وشعاع السرعة ثابت المقدار ومتغير الجهة، مماسي في كل نقطة وفي جهة الحركة. الدور T هو الزمن اللازم لإنجاز دورة كاملة.</p>
<div class="eq">v⃗ = v t⃗ , a⃗ = (dv/dt) t⃗ + (v²/r) n⃗</div>
<div class="eq">dv/dt = 0 ⟹ a = a_N = v²/r , T = 2πr / v</div>
<p>معلم فريني معلم متحرك مبدؤه مركز عطالة الجملة. شعاع الوحدة t⃗ محمول على المماس وموجه بجهة الحركة، و n⃗ ناظمي عليه وموجه نحو مركز الدائرة.</p>
<h3>الحركة المدارية لكوكب</h3>
<p>الجملة: الكوكب. المرجع: هيليومركزي. القوة: جذب الشمس للكوكب. بتطبيق القانون الثاني لنيوتن:</p>
<div class="eq">G m M_S / r² = m v² / r ⟹ v_orb = √(G M_S / r)</div>
<div class="eq">T = 2π √(r³ / (G M_S)) ⟹ T² / r³ = 4π² / (G M_S) = K</div>
<p>K لا يتعلق بكتلة الكوكب المدروس، وإنما بكتلة الجسم الثابت الذي يدور حوله.</p>
<h3>حركة قمر اصطناعي حول الأرض</h3>
<p>الجملة: القمر. المرجع: مركزي أرضي. القوة: جذب الأرض للقمر، و r = R_T + h حيث h ارتفاع القمر عن سطح الأرض.</p>
<div class="eq">v_orb = √(G M_T / (R_T + h))</div>
<div class="eq">T = 2π √((R_T + h)³ / (G M_T))</div>
<h3>القمر الجيومستقر</h3>
<p>يظهر ساكنا بالنسبة لمراقب على سطح الأرض. دوره يساوي دور الأرض حول محورها T = 24 h، ومساره في مستوي خط الاستواء، ويدور في جهة دوران الأرض.</p>
<h3>بكالوريا 2009 ع.ت</h3>
<p>يدور قمر اصطناعي حول الأرض في مسار دائري على ارتفاع h. 1) ما المقصود بالمعلم المركزي الأرضي؟ 2) أكتب القانون الثالث لكبلر. 3) أوجد v² بدلالة G و M_T و R_T و h. 4) عرف القمر الجيومستقر واحسب ارتفاعه وسرعته. 5) احسب قوة جذب الأرض له. 6) اشرح لماذا لا يسقط رغم ذلك.</p>
<p>R = 6400 km و m_s = 2,0×10³ kg و M_T = 5,97×10²⁴ kg و G = 6,67×10⁻¹¹ N·m²·kg⁻² و T = 24 h:</p>
<div class="eq">h = (T² G M_T / 4π²)^(1/3) − R_T = 35841 km</div>
<div class="eq">v = 3070 m/s , F = G M_T m_s / (R_T + h)² = 446,33 N</div>
<p>المعلم المركزي الأرضي: مبدؤه مركز الأرض ومحاوره موجهة نحو ثلاث نجوم ثابتة، ويختار لدراسة حركة القمر والأقمار الاصطناعية والمركبات الفضائية.</p>
<div class="eq">T² / r³ = 4π² / (G M_T) , v² = G M_T / (R_T + h)</div>
<p>الدوران حول الأرض يمنع القمر من السقوط.</p>`;
function drawBall(c,x,y,R){
  c.fillStyle='#fff';c.strokeStyle='#111';c.lineWidth=1;c.beginPath();c.arc(x,y,R,0,7);c.fill();c.stroke();
  const pent=(px,py,r)=>{c.fillStyle='#111';c.beginPath();for(let i=0;i<5;i++){const t=-Math.PI/2+i*2*Math.PI/5;c.lineTo(px+r*Math.cos(t),py+r*Math.sin(t))}c.closePath();c.fill()};
  pent(x,y,R*.36);
  c.save();c.beginPath();c.arc(x,y,R,0,7);c.clip();
  for(let i=0;i<5;i++){const t=-Math.PI/2+i*2*Math.PI/5;pent(x+R*.95*Math.cos(t),y+R*.95*Math.sin(t),R*.3)}
  c.restore();
}

      'y = f(x)':{xl:'x (m)',yl:'y (m)',series:[{name:'y',color:cur,pts:st.map(([,o])=>[o.x,o.y]),mark:[s.x,s.y]}]},

      'v = f(t)':{xl:'t (s)',yl:'v (m/s)',series:[line('v',cur,V)]},
      'الطاقات = f(t)':{xl:'t (s)',yl:'E (J)',series:[line('E_c',cur,o=>p.m*V(o)**2/2),line('E_pp',css('--g'),o=>p.m*p.g*(p.down?p.h-o.y:o.y)),line('E_T',css('--f'),o=>p.m*V(o)**2/2+p.m*p.g*(p.down?p.h-o.y:o.y))]}
    }[graph.sel.value];
    plot(graph.cv,{...g,mark:true});
  }};

// قرص الأرض داخل الصورة: المركز (640, 625) ونصف القطر 540 بكسل
function drawEarth(c,x,y,R,rot=0){
  c.save();c.beginPath();c.arc(x,y,R,0,7);c.clip();c.translate(x,y);c.rotate(rot);
  if(EARTH_IMG.complete)c.drawImage(EARTH_IMG,100,85,1080,1080,-R,-R,2*R,2*R);
  c.restore();
}
function drawObserver(c,x,y,R,ang){
  const ox=x+R*Math.cos(ang),oy=y-R*Math.sin(ang);
  c.fillStyle='#ef4444';c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(ox,oy,4,0,7);c.fill();c.stroke();
  c.fillStyle='#fecaca';c.font='12px Tahoma';c.fillText('مراقب',ox+6,oy+14);
}
function drawSatellite(c,x,y){
  c.fillStyle='#64748b';c.fillRect(x-4,y-4,8,8);
  c.fillStyle='#1d4ed8';c.fillRect(x-14,y-3,9,6);c.fillRect(x+5,y-3,9,6);
}

<p><b>أرسطو (384 ق م – 322 ق م):</b> قسم الميكانيك إلى سماوية (فلكية مثالية) وأرضية. الكون كروي محدود، والأرض مركزه. الأجسام الثقيلة تسقط أسرع من الخفيفة، والجسم يتوقف عندما تنعدم القوى المؤثرة عليه.</p>

<p><b>غاليلي (1564 – 1642 م):</b> بإهمال مقاومة الهواء تسقط الأجسام بسرعة واحدة وتسارع ثابت. اخترع منظارا فلكيا، وأعطى مبدأ النسبية الغاليلية.</p>
<p><b>نيوتن (1642 – 1727 م):</b> نشر «المبادئ» عام 1687، ووضع قوانينه الثلاثة وقانون الجذب العام.</p>
<h3>المفاهيم الأساسية</h3>
<p><b>النقطة المادية:</b> جسم أبعاده مهملة أمام المسافات التي يقطعها، تتمركز كتلته في نقطة هندسية. <b>الجملة الميكانيكية:</b> جسم أو جزء منه أو مجموعة أجسام مختارة للدراسة، يحدها الوسط الخارجي. <b>مركز العطالة G:</b> نقطة من الجسم المعزول أو شبه المعزول تكون ساكنة أو في حركة مستقيمة منتظمة بالنسبة لمعلم عطالي.</p>
<p><b>المعالم:</b> معلم الفضاء (O,x,y,z) أو (O,x,y) أو (O,x) لتحديد الموضع، ومعلم الزمن بمبدأ t = 0.</p>
<p><b>المرجع العطالي (الغاليلي):</b> يتحقق فيه مبدأ العطالة. وكل مرجع في إزاحة مستقيمة منتظمة بالنسبة له غاليلي أيضا. أهمها الهيليومركزي لحركة الكواكب، والجيومركزي لحركة القمر والأقمار الاصطناعية، والسطحي الأرضي للحركات قرب سطح الأرض خلال مدة قصيرة أمام 24 ساعة.</p>
<h3>شعاع الموضع</h3>
<div class="eq">OG = x i + y j + z k , ‖OG‖ = √(x² + y² + z²)</div>
<h3>شعاع السرعة</h3>
<div class="eq">v_m = ΔOG / Δt = (Δx/Δt) i + (Δy/Δt) j + (Δz/Δt) k</div>
<div class="eq">v = lim(Δt→0) v_m = dOG/dt = (dx/dt) i + (dy/dt) j + (dz/dt) k</div>
<p>مبدؤه موضع المتحرك، واتجاهه جهة الحركة، وحامله مماس للمنحنى. طويلته:</p>

<p><b>مثال:</b> x = 2t² و y = t⁴ − 3t³: v = 4t i + (4t³ − 9t²) j. عند t = 4 s: v = 16 i + 112 j و ‖v‖ = 113,14 m/s.</p>
<h3>شعاع التسارع</h3>
<div class="eq">a_m = Δv / Δt = (v₂ − v₁) / (t₂ − t₁)</div>

/* ---------- أدوات مشتركة للمحاكيات ---------- */
function clock(tools,stage,side,tmax,loop){
  let t=0,play=false,rate=1;
  const b=btn(tools,'▶ تشغيل',()=>{if(t>=tmax())t=0;play=!play;sb()},'main'),sb=()=>b.textContent=play?'⏸ إيقاف':'▶ تشغيل';
  btn(tools,'⟲ إعادة',()=>{t=0;play=false;sb()});
  const tl=timeline(stage,{unit:'t',max:tmax,step:()=>tmax()/60,get:()=>t,raw:v=>t=v,set:v=>{t=v;play=false;sb()}});
  slider(side,{label:'سرعة العرض',unit:'×',min:.1,max:3,step:.1,value:1,on:v=>rate=v});
  return{get t(){return t},set t(v){t=v},restart(){t=0;play=true;sb()},reset(){t=0;play=false;sb()},tick(dt){if(play){t+=dt*rate;if(t>=tmax()){if(loop)t=0;else{t=tmax();play=false;sb()}}}if(t>tmax())t=tmax();tl.sync()}};
}
function controls(side,p,defs,on){
  const S={};
  for(const [k,label,unit,min,max,step,dec] of defs)S[k]=slider(side,{label,unit,min,max,step,dec,value:p[k],on:v=>{p[k]=v;on(k)}});
  return{S,load(q){Object.assign(p,q);for(const k in q)if(S[k])S[k].set(q[k]);on()}};
}
function line(name,color,f,tm,t){
  const pts=Array.from({length:121},(_,i)=>{const q=tm*i/120;return[q,f(q)]});
  return{name,color,pts,mark:[t,f(t)]};
}
function drawGraph(g,table){plot(g.cv,{...table[g.sel.value](),mark:true})}
function scales(side,defs){
  side.append(el('div','side-h','سلم الرسم (1 cm يمثل)'));
  const o={};const sl={};for(const [k,label,unit,min,max,step,v] of defs){o[k]=v;sl[k]=slider(side,{label,unit,min,max,step,value:v,on:x=>o[k]=x})}
  o.put=(k,v)=>{o[k]=v;sl[k].set(v)};
  return o;
}
function box(c,x,y,w,h,col,lab,rot=0){

}

function simVectors(root){

  const p={xs:'2t^2',ys:'t^4-3t^3',T:4,dt:.5,vm:false};
  const parse=str=>{
    const q=str.replace(/\s/g,'').replace(/−/g,'-').replace(/,/g,'.').replace(/²/g,'^2').replace(/³/g,'^3').replace(/⁴/g,'^4');
    const TERM='(?:(?:\\d+(?:\\.\\d+)?\\*?)?t(?:\\^[0-4])?|\\d+(?:\\.\\d+)?)';if(!new RegExp('^[+-]?'+TERM+'(?:[+-]'+TERM+')*$').test(q))return null;
    const C=[0,0,0,0,0];
    for(const m of q.matchAll(/([+-]?)(\d+(?:\.\d+)?)?\*?(t(?:\^([0-4]))?)?/g)){
      if(!m[0])continue;
      if(!m[2]&&!m[3])return null;
      const n=m[3]?(m[4]===undefined?1:+m[4]):0;

  };
  let CX=parse(p.xs),CY=parse(p.ys);

  const field=(lab,key,set)=>{
    const w=el('div','ctl'),l=el('label'),t=el('input'),h=el('small','hint');
    t.type='text';t.value=p[key];t.dir='ltr';t.className='eqin';t.setAttribute('aria-label',lab);l.append(lab,t);w.append(l,h);side.prepend(w);
    t.onchange=()=>{const C=parse(t.value);if(!C){h.textContent='مثال صحيح: 2t^3-5t';return}h.textContent='';p[key]=t.value;set(C);k.t=Math.min(k.t,p.T)};

  };
  const Fy=field('y(t) =','ys',C=>CY=C),Fx=field('x(t) =','xs',C=>CX=C);
  const sT=slider(side,{label:'مدة الدراسة',unit:'s',min:1,max:8,step:.5,value:p.T,on:v=>{p.T=v}});
  slider(side,{label:'المدة Δt لشعاع v_m',unit:'s',min:.1,max:2,step:.1,value:p.dt,on:v=>p.dt=v});
  const vmL=el('label','chk','<input type="checkbox"> إظهار الشعاعين المتوسطين v_m و a_m');side.append(vmL);vmL.querySelector('input').onchange=e=>p.vm=e.target.checked;
  const scl=scales(side,[['v','السرعة','m/s',1,100,1,50],['a','التسارع','m/s²',1,100,1,50]]);
  const ex=(xs,ys,T)=>{p.xs=xs;p.ys=ys;p.T=T;Fx.value=xs;Fy.value=ys;CX=parse(xs);CY=parse(ys);sT.set(T);k.reset();k.t=T};
  btn(tools,'مثال السرعة: t = 4 s',()=>ex('2t^2','t^4-3t^3',4));
  btn(tools,'مثال التسارع: t = 3 s',()=>ex('2t^3-5t','5t^2-1',3));

  const P=a=>a==='x'?CX:CY;

  const d2=(C,t)=>12*C[0]*t**2+6*C[1]*t+2*C[2];

  const note=el('div','card notes');root.append(note);

    const q=z=>z/scl.F*CM,TA=[Math.cos(ra),-Math.sin(ra)],TB=[-Math.cos(rb),-Math.sin(rb)];

    const mb=p.mB+p.m;arrow(c,B[0],B[1],0,q(mb*p.g),css('--g'),'P_B');arrow(c,B[0],B[1],TB[0]*q(Ten),TB[1]*q(Ten),css('--v'),'T_B');arrow(c,B[0],B[1],nB[0]*q(mb*p.g*Math.cos(rb)),nB[1]*q(mb*p.g*Math.cos(rb)),css('--muted'),'R_B');
    c.fillStyle=css('--ink');c.font='13px Tahoma';c.fillText('α',lL+26,bY-5);c.fillText('β',rR-34,bY-5);void Lx;void Rx;
    drawGraph(g,{'v = f(t)':()=>({xl:'t (s)',yl:'v (m/s)',series:[line('v',css('--v'),z=>a*z,5,t)]})});
  }};
}

/* ---------- 14. حدود ميكانيك نيوتن ---------- */
function simLimits(root){
  const {tools,cv,side,stage}=shell(root,'حدود ميكانيك نيوتن','الطاقة في الذرة مكممة: لا تنتقل الإلكترونات بين المدارات إلا بإصدار فوتون أو امتصاصه.');
  const p={n1:3,n2:2,d:5.3e-11},h=6.62e-34,cl=3e8,e=1.6e-19;
  let ph=0;
  const E=n=>n>=99?0:-13.6/(n*n);
  const S1=slider(side,{label:'السوية الابتدائية n',min:1,max:7,step:1,value:3,on:v=>{p.n1=v;ph=0}}),S2=slider(side,{label:'السوية النهائية n',min:1,max:7,step:1,value:2,on:v=>{p.n2=v;ph=0}});
  const ion=el('label','chk','<input type="checkbox"> تشرد الذرة (n → ∞، E∞ = 0)');side.append(ion);const ii=ion.querySelector('input');ii.onchange=()=>ph=0;
  btn(tools,'إصدار: 3 → 2',()=>{p.n1=3;p.n2=2;S1.set(3);S2.set(2);ii.checked=false;ph=0});
  btn(tools,'امتصاص: 1 → 2',()=>{p.n1=1;p.n2=2;S1.set(1);S2.set(2);ii.checked=false;ph=0});
  btn(tools,'⟲ إعادة الانتقال',()=>ph=0);
  side.append(el('div','side-h','مقارنة القوتين بين بروتون وإلكترون'));
  slider(side,{label:'البعد d (×10⁻¹¹ m)',unit:'m',min:1,max:50,step:.1,value:5.3,on:v=>p.d=v*1e-11});
  side.append(el('div','side-h','طاقة الجملة كوكب – قمر'));
  p.r=42241;slider(side,{label:'نصف قطر المدار r',unit:'km',min:7000,max:100000,step:1,value:p.r,on:v=>p.r=v});
  const set=reads(root,[['Ec','E_c = ½ m g r (m = 2000 kg)'],['gr','g على المدار'],['Ei','E الابتدائية'],['Ef','E النهائية'],['dE','|ΔE|'],['nu','التواتر ν'],['lam','طول الموجة λ'],['type','نوع الانتقال'],['Fg','F_g = G m_p m_e / d²'],['Fe','F_e = K e² / d²'],['r','F_e / F_g']]);
  lesson(root,LESSON_LIMITS);
  const g=el('div');stage.append(g);
  return{frame(dt){
    ph=Math.min(1,ph+dt*.5);
    const nf=ii.checked?99:p.n2,E1=E(p.n1),E2=E(nf),dE=Math.abs(E2-E1),nu=dE*e/h,up=E2>E1;
    set('Ei',fmt(E1,3)+' eV');set('Ef',fmt(E2,3)+' eV');set('dE',fmt(dE,3)+' eV');set('nu',dE?fmt(nu)+' Hz':'—');set('lam',dE?fmt(cl/nu)+' m':'—');set('type',!dE?'لا انتقال':up?'امتصاص':'إصدار');
    const rM=p.r*1000,gM=LESSON_G*LESSON_MT/(rM*rM);set('gr',fmt(gM,4)+' m/s²');set('Ec',fmt(.5*2000*gM*rM)+' J');
    const Fg=LESSON_G*1.67e-27*9.1e-31/p.d**2,Fe=9e9*e*e/p.d**2;set('Fg',fmt(Fg)+' N');set('Fe',fmt(Fe)+' N');set('r',fmt(Fe/Fg));
    const {c,W,H}=fit(cv),Y=q=>30+(H-60)*(q/-13.6),ink=css('--ink');
    c.font='12px Tahoma';
    c.fillStyle=ink;c.fillText('E (eV)',W-52,16);
    c.strokeStyle=css('--p');c.lineWidth=1;c.beginPath();c.moveTo(70,Y(0));c.lineTo(W-90,Y(0));c.stroke();c.fillStyle=ink;c.fillText('n = ∞ , E = 0',W-86,Y(0)+4);
    for(let n=1;n<=7;n++){c.strokeStyle=n===p.n1||(!ii.checked&&n===p.n2)?css('--a'):css('--muted');c.lineWidth=n===p.n1||(!ii.checked&&n===p.n2)?2.5:1;c.beginPath();c.moveTo(70,Y(E(n)));c.lineTo(W-90,Y(E(n)));c.stroke();c.fillStyle=ink;if(n<4||n===7&&false)c.fillText(`n = ${n} : ${fmt(E(n),2)}`,W-86,Y(E(n))+4);else if(n===4)c.fillText('n = 4 ...',W-86,Y(E(n))+4);}
    const x=W*.42,y=Y(E1)+(Y(E2)-Y(E1))*ph;
    if(dE){arrow(c,x,Y(E1),0,(Y(E2)-Y(E1))*ph,css('--f'));
      const py=(up?Y(E1):Y(E2)),q=up?x-140*(1-Math.min(1,ph*1.5)):x+140*ph;c.strokeStyle=css('--v');c.lineWidth=2;c.beginPath();for(let i=0;i<=40;i++){const X=q+i*2.2-44,Yv=py-8+6*Math.sin(i*.8);i?c.lineTo(X,Yv):c.moveTo(X,Yv)}c.stroke();c.fillStyle=css('--v');c.fillText('h ν',q+6,py-20);}
    c.fillStyle=css('--a');c.beginPath();c.arc(x,y,7,0,7);c.fill();
  }};
}
const SIMS=[
  ['أشعة r و v و a',simVectors],['النضد الهوائي والقانون الثاني',simAirTable],['النابض على النضد الهوائي',simSpring],['الفعلان المتبادلان والجذب العام',simMutual],
  ['قوانين كبلر والأقمار',simKepler],['الكواكب حول الشمس',simPlanets],['الدائرية ومعلم فريني',simFrenet],['السقوط في الهواء',simAirFall],['السقوط الحر والقذف الشاقولي',simFree],
  ['حركة قذيفة',simProjectile],['المستوي الأفقي والبكرة',simPulley],['المستوي المائل',simIncline],['المستويان المائلان',simDouble],['حدود ميكانيك نيوتن',simLimits]
];
const main=document.getElementById('main'),nav=document.getElementById('nav');
let active=null,last=0,buttons=[];
let marks=[],markOn=false,pathPts=null,simTL=null;
// مسار الجسم وأشعته عند كل لحظة، يحسب بتشغيل المحاكاة نفسها دون رسم البيانات
function samplePath(){
  if(!simTL||!simTL.raw)return[];
  const old=simTL.get(),max=(simTL.pathMax||simTL.max)()*.999,pts=[];
  if(!(max>0))return pts;
  NOGRAPH=true;
  for(let i=0;i<=240;i++){
    const t=max*i/240;simTL.raw(t);CAP=[];CAP.body=null;active.frame(0);
    if(CAP.body){const [x,y]=CAP.body;pts.push({x,y,t,arrows:CAP.filter(a=>Math.hypot(a.x-x,a.y-y)<3)})}
  }
  CAP=null;simTL.raw(old);NOGRAPH=false;active.frame(0);
  return pts;
}
function setupMarks(){
  marks=[];markOn=false;pathPts=null;
  const t=main.querySelector('.tools'),cv=main.querySelector('canvas');
  if(!simTL||!simTL.raw)return;
  const reset=()=>{marks=[];pathPts=null};
  const hint=el('small','hint');
  const b=btn(t,'تعليم نقطة على المسار',()=>{markOn=!markOn;pathPts=null;hint.textContent='';b.classList.toggle('mk',markOn);cv.classList.toggle('marking',markOn)});
  btn(t,'مسح النقاط',()=>{marks=[]});
  t.append(hint);
  main.oninput=e=>{if(e.target.matches('.ctl input'))reset()};
  main.addEventListener('change',e=>{if(e.target.matches('.chk input,.chk select'))reset()});
  t.addEventListener('click',e=>{const x=e.target;if(x===b||!x.matches('.btn')||x.matches('.main')||x.textContent.includes('إعادة')||x.textContent.includes('مسح'))return;reset()});
  cv.addEventListener('pointerdown',e=>{if(markOn){e.stopImmediatePropagation();e.preventDefault()}},true);
  cv.addEventListener('click',e=>{
    if(!markOn)return;
    e.stopImmediatePropagation();
    if(!pathPts)pathPts=samplePath();
    const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;let best=null,bd=1e9;
    for(const q of pathPts){const d=Math.hypot(q.x-mx,q.y-my);if(d<bd){bd=d;best=q}}
    if(!best||bd>25){hint.textContent='اضغط على المسار المنقط.';return}
    hint.textContent='';
    marks.push({cv,...best,n:marks.length+1});marks.sort((a,c)=>a.t-c.t);marks.forEach((m,i)=>m.n=i+1);
  },true);
}
function drawMarks(){
  const cv=main.querySelector('canvas');
  if(markOn&&cv){
    if(!pathPts)pathPts=samplePath();
    const c=cv.getContext('2d');c.fillStyle='rgba(239,68,68,.65)';
    for(const q of pathPts){c.beginPath();c.arc(q.x,q.y,1.6,0,7);c.fill()}
  }
  const now=simTL&&simTL.get?simTL.get():0;
  for(const m of marks){
    const c=m.cv.getContext('2d'),passed=now>=m.t;
    if(passed){
      c.globalAlpha=.8;
      for(const a of m.arrows)arrow(c,a.x,a.y,a.dx,a.dy,a.color,a.label);
      c.fillStyle='#cbd5e1';c.strokeStyle='#0f172a';c.lineWidth=1;c.beginPath();c.arc(m.x,m.y,6,0,7);c.fill();c.stroke();
      c.globalAlpha=1;
    }
    c.fillStyle=passed?'#ef4444':'rgba(239,68,68,.5)';c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(m.x,m.y,3.5,0,7);c.fill();c.stroke();
    c.font='600 13px Tahoma';c.lineWidth=3;c.strokeStyle='rgba(15,23,42,.75)';c.strokeText('M'+m.n,m.x+7,m.y-7);c.fillStyle='#fff';c.fillText('M'+m.n,m.x+7,m.y-7);
  }
}
function open(i){
  buttons.forEach((b,j)=>b.classList.toggle('on',j===i));
  lastTL=null;main.oninput=null;
  active=SIMS[i][1](main);
  simTL=lastTL;
  setupMarks();
  main.classList.remove('enter');void main.offsetWidth;main.classList.add('enter');
  window.scrollTo({top:0});
  // تبدأ الحركة مباشرة، عدا الأشعة التي تعرض لحظة المثال
  if(i!==0&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const b=main.querySelector('.tools .btn.main');if(b&&b.textContent.includes('تشغيل'))b.click()}
}
document.addEventListener('keydown',e=>{
  const el0=e.target instanceof Element?e.target:document.body;
  if(el0.matches('input[type=text],select'))return;
  const tb=main.querySelectorAll('.tline .btn');
  if(e.code==='Space'){const b=main.querySelector('.tools .btn.main');if(b){e.preventDefault();b.click()}}
  else if(el0.matches('input[type=range]'))return;
  else if(e.code==='ArrowRight'&&tb[2]){e.preventDefault();tb[2].click()}
  else if(e.code==='ArrowLeft'&&tb[1]){e.preventDefault();tb[1].click()}
});
SIMS.forEach(([t,fn],i)=>{
  const b=el('button');b.type='button';b.append(`${i+1}. ${t}`);
  if(fn)b.onclick=()=>open(i);else{b.disabled=true;b.append(el('small',null,'قريبا'))}
  nav.append(b);buttons.push(b);
});
function loop(ts){
  const dt=Math.min((ts-last)/1000,.05);last=ts;
  if(active){active.frame(dt);drawMarks()}
  requestAnimationFrame(loop);
}
open(0);
requestAnimationFrame(loop);
</script>
